- id: enisa-srp-page
  authority: European Union Agency for Cybersecurity (ENISA)
  document_identifier: CRA Single Reporting Platform (SRP)
  title: Single Reporting Platform (SRP)
  short_title: ENISA CRA SRP overview page
  oj_reference: null
  article_or_section:
    content: The CRA introduces the Single Reporting Platform (SRP) for cybersecurity
      incident reporting in the EU Digital Single Market. The SRP will be used by
      CSIRTs and manufacturers for mandatory reporting under Articles 14 and 15 and
      could be used by any natural/legal persons for voluntary reporting under Article
      15. The SRP is established and operated under Article 16 of the CRA. The CRA
      mandates manufacturers to report actively exploited vulnerabilities and severe
      incidents as of 11 September 2026 onwards using the SRP. Updated 27 July 2026.
    references:
      article_14: mandatory reporting obligations
      article_15: voluntary reporting
      article_16: establishment and operation of the Single Reporting Platform
  interpretation_note: The phrase "could be used by any natural/legal persons for
    voluntary reporting" in the article_or_section content is an interpretation of
    the regulation text. Regulation (EU) 2024/2847 Article 15(3) states that the SRP
    "may also" be used for voluntary reporting; the word "could" reflects ENISA's
    summarisation rather than a binding obligation.
  publication_or_version_date: '2026-07-27'
  retrieved_at: '2026-07-31'
  validation_date: '2026-07-31'
  source_type: enisa_tool
  validation_status: pending_review
  jurisdiction: European Union
  language: en
  access_note: 'ENISA landing page for the SRP. Contains SRP FAQs (updated 27 July
    2026) and links to CRA reporting information at https://digital-strategy.ec.europa.eu/en/policies/cra-reporting.

    '
  source_url: https://www.enisa.europa.eu/topics/product-security-and-certification/single-reporting-platform-srp
