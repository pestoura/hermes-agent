name: Validate governance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Minimum permissions: read-only access to repository contents.
# Fork PRs use GITHUB_TOKEN from the workflow (never pull_request_target).
permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema pytest

      - name: Validate BlitzHub governance
        run: python scripts/validate_governance.py

      - name: Run governance validator tests
        run: python -m pytest tests/test_governance_validator.py -v -p no:cacheprovider

      - name: Run orchestrator state machine tests
        run: python -m pytest tests/orchestrator_state_machine_test.py -v -p no:cacheprovider

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
          args: "[--verbose, --report-format, json, --redact]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
