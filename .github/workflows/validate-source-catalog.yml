name: Validate CRA source catalogue

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml pytest

      - name: Validate source catalogue (standalone script)
        run: python scripts/validate_source_catalog.py

      - name: Run pytest test suite
        run: python -m pytest tests/test_source_catalog.py -v
