<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  BlitzHub CRA Product Orchestrator — State Machine Diagram (versioned).

  This is a hand-authored, version-controlled diagram of the state machine
  specified in orchestrator-state-machine.yaml.  The canonical, machine-
  readable source of truth is the YAML file; this SVG renders the same
  topology for human consumption and is updated alongside the specification.

  Generated: 2026-07-31
  Source of truth: docs/architecture/orchestrator-state-machine.yaml
  Schema: .blitzhub/schemas/orchestrator-state-machine.yaml.schema.json
  Tests: tests/orchestrator_state_machine_test.py
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  width="1000"
  height="820"
  viewBox="0 0 1000 820"
  font-family="Segoe UI, system-ui, -apple-system, sans-serif"
  font-size="14"
>
  <!-- Background -->
  <rect width="1000" height="820" fill="#0d1117" stroke="none"/>

  <!-- Title -->
  <text x="500" y="36" text-anchor="middle" fill="#c9d1d9" font-size="18" font-weight="600">
    CRA Product Orchestrator — State Machine
  </text>
  <text x="500" y="58" text-anchor="middle" fill="#6e7681" font-size="12">
    github.com/pestoura/blitzhub-cra-navigator · Issue #7
  </text>

  <!-- ---- State nodes ---- -->
  <!-- Layout: 4 columns x 3 rows -->

  <!-- Row 1 -->
  <g id="state-inbox" transform="translate(40, 120)">
    <rect width="200" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="100" y="20" text-anchor="middle" fill="#58a6ff" font-weight="600">inbox</text>
    <text x="100" y="40" text-anchor="middle" fill="#8b949e" font-size="12">Inbox</text>
    <text x="100" y="52" text-anchor="middle" fill="#6e7681" font-size="10">operational</text>
  </g>

  <g id="state-backlog" transform="translate(400, 120)">
    <rect width="200" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="100" y="20" text-anchor="middle" fill="#58a6ff" font-weight="600">backlog</text>
    <text x="100" y="40" text-anchor="middle" fill="#8b949e" font-size="12">Backlog</text>
    <text x="100" y="52" text-anchor="middle" fill="#6e7681" font-size="10">operational</text>
  </g>

  <g id="state-blocked" transform="translate(760, 120)">
    <rect width="200" height="56" rx="8" fill="#161b22" stroke="#f2cc60" stroke-width="2"/>
    <text x="100" y="20" text-anchor="middle" fill="#f2cc60" font-weight="600">blocked</text>
    <text x="100" y="40" text-anchor="middle" fill="#8b949e" font-size="12">Blocked</text>
    <text x="100" y="52" text-anchor="middle" fill="#6e7681" font-size="10">interruption</text>
  </g>

  <!-- Row 2 -->
  <g id="state-ready" transform="translate(40, 320)">
    <rect width="200" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="100" y="20" text-anchor="middle" fill="#58a6ff" font-weight="600">ready</text>
    <text x="100" y="40" text-anchor="middle" fill="#8b949e" font-size="12">Ready</text>
    <text x="100" y="52" text-anchor="middle" fill="#6e7681" font-size="10">operational</text>
  </g>

  <g id="state-in_progress" transform="translate(400, 320)">
    <rect width="200" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="100" y="20" text-anchor="middle" fill="#58a6ff" font-weight="600">in_progress</text>
    <text x="100" y="40" text-anchor="middle" fill="#8b949e" font-size="12">In Progress</text>
    <text x="100" y="52" text-anchor="middle" fill="#6e7681" font-size="10">operational</text>
  </g>

  <g id="state-pull_request" transform="translate(760, 320)">
    <rect width="200" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="100" y="20" text-anchor="middle" fill="#58a6ff" font-weight="600">pull_request</text>
    <text x="100" y="40" text-anchor="middle" fill="#8b949e" font-size="12">Pull Request</text>
    <text x="100" y="52" text-anchor="middle" fill="#6e7681" font-size="10">operational</text>
  </g>

  <!-- Row 3 -->
  <g id="state-supervisory_review" transform="translate(40, 520)">
    <rect width="220" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="110" y="20" text-anchor="middle" fill="#58a6ff" font-weight="600">supervisory_review</text>
    <text x="110" y="40" text-anchor="middle" fill="#8b949e" font-size="12">Supervisory Review</text>
    <text x="110" y="52" text-anchor="middle" fill="#6e7681" font-size="10">operational</text>
  </g>

  <g id="state-rework" transform="translate(400, 520)">
    <rect width="200" height="56" rx="8" fill="#161b22" stroke="#f85177" stroke-width="2"/>
    <text x="100" y="20" text-anchor="middle" fill="#f85177" font-weight="600">rework</text>
    <text x="100" y="40" text-anchor="middle" fill="#8b949e" font-size="12">Rework</text>
    <text x="100" y="52" text-anchor="middle" fill="#6e7681" font-size="10">operational</text>
  </g>

  <g id="state-ready_to_merge" transform="translate(760, 520)">
    <rect width="200" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="100" y="20" text-anchor="middle" fill="#58a6ff" font-weight="600">ready_to_merge</text>
    <text x="100" y="40" text-anchor="middle" fill="#8b949e" font-size="12">Ready to Merge</text>
    <text x="100" y="52" text-anchor="middle" fill="#6e7681" font-size="10">operational</text>
  </g>

  <!-- Row 4: terminal states -->
  <g id="state-done" transform="translate(40, 700)">
    <rect width="200" height="56" rx="8" fill="#161b22" stroke="#238636" stroke-width="2"/>
    <text x="100" y="20" text-anchor="middle" fill="#3fb950" font-weight="600">done</text>
    <text x="100" y="40" text-anchor="middle" fill="#8b949e" font-size="12">Done</text>
    <text x="100" y="52" text-anchor="middle" fill="#6e7681" font-size="10">terminal</text>
  </g>

  <g id="state-deferred" transform="translate(400, 700)">
    <rect width="200" height="56" rx="8" fill="#161b22" stroke="#8b4507" stroke-width="2"/>
    <text x="100" y="20" text-anchor="middle" fill="#d29922" font-weight="600">deferred</text>
    <text x="100" y="40" text-anchor="middle" fill="#8b949e" font-size="12">Deferred</text>
    <text x="100" y="52" text-anchor="middle" fill="#6e7681" font-size="10">interruption</text>
  </g>

  <g id="state-external_review" transform="translate(760, 700)">
    <rect width="200" height="56" rx="8" fill="#161b22" stroke="#6f42c1" stroke-width="2"/>
    <text x="100" y="20" text-anchor="middle" fill="#bc8cff" font-weight="600">external_review</text>
    <text x="100" y="40" text-anchor="middle" fill="#8b949e" font-size="12">External Review</text>
    <text x="100" y="52" text-anchor="middle" fill="#6e7681" font-size="10">terminal_external</text>
  </g>

  <!-- ---- Transition arrows ---- -->

  <!-- t01: inbox -> backlog -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#58a6ff"/>
    </defs>

  <!-- Normal flow (blue arrows) -->
  <line x1="240" y1="160" x2="400" y2="148" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="140" fill="#8b949e" font-size="10" text-anchor="middle">t01</text>

  <line x1="300" y1="348" x2="240" y2="348" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="330" fill="#8b949e" font-size="10" text-anchor="middle">t02</text>

  <line x1="100" y1="376" x2="100" y2="416" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="120" y="390" fill="#8b949e" font-size="10" text-anchor="middle">t03</text>

  <line x1="500" y1="348" x2="500" y2="392" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="360" fill="#8b949e" font-size="10" text-anchor="middle">t04</text>

  <line x1="260" y1="548" x2="400" y2="548" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="530" fill="#8b949e" font-size="10" text-anchor="middle">t05</text>

  <line x1="550" y1="548" x2="600" y2="548" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="575" y="530" fill="#8b949e" font-size="10" text-anchor="middle">t06</text>

  <line x1="860" y1="548" x2="860" y2="700" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="880" y="620" fill="#8b949e" font-size="10" text-anchor="middle">t07</text>

  <!-- Rework arrows (red) -->
  <line x1="330" y1="548" x2="500" y2="548" stroke="#f85177" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="415" y="530" fill="#f85177" font-size="10" text-anchor="middle">t08</text>

  <line x1="860" y1="392" x2="860" y2="548" stroke="#f85177" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="880" y="465" fill="#f85177" font-size="10" text-anchor="middle">t09</text>

  <line x1="500" y1="548" x2="330" y2="548" stroke="#f85177" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="415" y="575" fill="#f85177" font-size="10" text-anchor="middle">t10</text>

  <!-- Block arrows (yellow) -->
  <line x1="540" y1="148" x2="760" y2="148" stroke="#f2cc60" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="650" y="130" fill="#f2cc60" font-size="10" text-anchor="middle">t11</text>

  <line x1="140" y1="348" x2="800" y2="348" stroke="#f2cc60" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="470" y="330" fill="#f2cc60" font-size="10" text-anchor="middle">t12</text>

  <line x1="500" y1="348" x2="860" y2="148" stroke="#f2cc60" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="680" y="240" fill="#f2cc60" font-size="10" text-anchor="middle">t13</text>

  <!-- Recovery -->
  <line x1="760" y1="176" x2="540" y2="176" stroke="#f2cc60" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="650" y="195" fill="#f2cc60" font-size="10" text-anchor="middle">t14</text>

  <!-- Defer arrows (orange) -->
  <line x1="240" y1="160" x2="240" y2="700" stroke="#d29922" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="260" y="420" fill="#d29922" font-size="10" text-anchor="middle">t15</text>

  <line x1="440" y1="728" x2="240" y2="728" stroke="#d29922" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340" y="745" fill="#d29922" font-size="10" text-anchor="middle">t16</text>

  <!-- External review -->
  <line x1="40" y1="148" x2="40" y2="700" stroke="#bc8cff" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="60" y="420" fill="#bc8cff" font-size="10" text-anchor="middle">t17</text>

  <!-- Dead letter -->
  <line x1="500" y1="120" x2="500" y2="148" stroke="#d73a49" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="130" fill="#d73a49" font-size="10" text-anchor="middle">t18</text>

  <!-- Dependency gate -->
  <line x1="240" y1="176" x2="240" y2="348" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="250" fill="#58a6ff" font-size="10" text-anchor="middle">t19</text>

  <!-- Wave gate -->
  <line x1="140" y1="348" x2="40" y2="148" stroke="#f2cc60" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="95" y="250" fill="#f2cc60" font-size="10" text-anchor="middle">t20</text>

  <!-- Legend -->
  <rect x="20" y="760" width="960" height="50" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
  <text x="40" y="780" fill="#8b949e" font-size="11">Legend: </text>
  <line x1="120" y1="780" x2="160" y2="780" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="168" y="783" fill="#58a6ff" font-size="11">Normal flow</text>
  <line x1="260" y1="780" x2="300" y2="780" stroke="#f85177" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="308" y="783" fill="#f85177" font-size="11">Rework</text>
  <line x1="380" y1="780" x2="420" y2="780" stroke="#f2cc60" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="428" y="783" fill="#f2cc60" font-size="11">Block / Wave gate</text>
  <line x1="560" y1="780" x2="600" y2="780" stroke="#d29922" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="608" y="783" fill="#d29922" font-size="11">Defer</text>
  <line x1="680" y1="780" x2="720" y2="780" stroke="#bc8cff" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="728" y="783" fill="#bc8cff" font-size="11">External review</text>
  <line x1="860" y1="780" x2="900" y2="780" stroke="#d73a49" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="908" y="783" fill="#d73a49" font-size="11">Dead-letter</text>
</svg>
